# Test configuration using H2 in-memory database
spring.application.name=SpringDataJPA-Test

# H2 In-Memory DataSource for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate properties for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Hikari keepalive for tests
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=0

# Disable Spring Boot auto-configuration for Oracle in tests
spring.autoconfigure.exclude=

# H2 console (optional for debugging)
spring.h2.console.enabled=false
