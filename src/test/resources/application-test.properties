# Test configuration using H2 in-memory database (replaces Oracle for tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable CommandLineRunner during context load tests
spring.autoconfigure.exclude=

# Suppress banner
spring.main.banner-mode=off

# Logging
logging.level.org.springframework=WARN
logging.level.com.sit=DEBUG
